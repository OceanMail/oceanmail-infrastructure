name: Repository documentation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: repo-docs-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check tracked JSON and inline local Markdown targets
        run: python3 scripts/check-docs.py
